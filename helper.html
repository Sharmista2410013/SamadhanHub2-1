<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helper Portal - Customer Chat & Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col transition-colors duration-200">

    <!-- Navbar / Header -->
    <header class="bg-indigo-600 dark:bg-indigo-900 text-white px-6 py-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Helper Portal</h1>
        <div class="flex items-center space-x-4">
            <!-- Theme Toggle Button -->
            <button onclick="toggleGlobalTheme()" class="flex items-center space-x-1 bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg text-sm transition">
                <span id="themeIcon">🌙</span>
                <span id="themeText">Dark</span>
            </button>
            <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full">Status: Online</span>
            <button onclick="logoutHelper()" class="text-sm bg-red-500 hover:bg-red-600 px-3 py-1 rounded transition">Logout</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 overflow-y-auto">
        <div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow p-6 border border-gray-200 dark:border-gray-700">
            <h2 class="text-2xl font-semibold mb-2">Welcome Back, Helper!</h2>
            <p class="text-gray-600 dark:text-gray-300">Manage your active customer requests and communicate instantly using the chat widget at the bottom right.</p>
        </div>
    </main>

    <!-- Floating Chat Toggle Button -->
    <div class="fixed bottom-6 right-6 z-50">
        <button id="chatToggleBtn" onclick="toggleChat()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-lg flex items-center justify-center transition transform hover:scale-105">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
        </button>
    </div>

    <!-- Customer Chat Box Container -->
    <div id="chatWindow" class="hidden fixed bottom-24 right-6 w-96 h-[500px] bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 z-50 flex flex-col overflow-hidden">
        
        <!-- Chat Header -->
        <div class="bg-indigo-600 dark:bg-indigo-900 text-white px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-green-400 rounded-full"></div>
                <h3 class="font-semibold text-sm">Customer Support Chat</h3>
            </div>
            <button onclick="toggleChat()" class="text-indigo-200 hover:text-white text-lg font-bold">&times;</button>
        </div>

        <!-- Chat Messages Area -->
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 dark:bg-gray-900">
            <div class="flex justify-start">
                <div class="bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 p-3 rounded-lg shadow-sm max-w-[80%] text-sm border border-gray-100 dark:border-gray-700">
                    Hello! I need help with my account. Are you available?
                </div>
            </div>
        </div>

        <!-- Chat Input Form -->
        <form id="chatForm" onsubmit="sendMessage(event)" class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex items-center space-x-2">
            <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off" required
                class="flex-1 border border-gray-300 dark:border-gray-600 bg-transparent rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                Send
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Toggle Chat Box Open/Close
        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            const chatInput = document.getElementById('chatInput');
            
            if (chatWindow.classList.contains('hidden')) {
                chatWindow.classList.remove('hidden');
                scrollToBottom();
                chatInput.focus();
            } else {
                chatWindow.classList.add('hidden');
            }
        }

        // Send Message Handler
        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('chatInput');
            const messagesContainer = document.getElementById('chatMessages');
            const messageText = input.value.trim();

            if (!messageText) return;

            // Append Helper's message
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex justify-end';
            messageDiv.innerHTML = `
                <div class="bg-indigo-600 text-white p-3 rounded-lg shadow-sm max-w-[80%] text-sm">
                    ${escapeHtml(messageText)}
                </div>
            `;
            messagesContainer.appendChild(messageDiv);

            input.value = '';
            scrollToBottom();

            // Simulate automatic response mockup
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'flex justify-start';
                replyDiv.innerHTML = `
                    <div class="bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 p-3 rounded-lg shadow-sm max-w-[80%] text-sm border border-gray-100 dark:border-gray-700">
                        Thanks for the update!
                    </div>
                `;
                messagesContainer.appendChild(replyDiv);
                scrollToBottom();
            }, 1000);
        }

        // Auto-scroll helper
        function scrollToBottom() {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Security helper to prevent XSS injection
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // --- Your Custom Script Logic Integrated Below ---

        const verifyResetBtn = document.getElementById('verifyResetBtn');
        const modal = document.getElementById('resetModal'); // Ensure element exists if modal used
        let savedIdentifier = ""; // Defined globally or scoped appropriately for your workflow

        if (verifyResetBtn) {
            verifyResetBtn.onclick = async () => {
                const code = document.getElementById('resetCodeInput').value.trim();
                const newPassword = document.getElementById('newPasswordInput').value.trim();
                const msg = document.getElementById('resetMsg');

                if (!code || !newPassword) {
                    msg.style.color = '#f87171';
                    msg.textContent = 'Please fill in both fields.';
                    return;
                }

                msg.style.color = '#94a3b8';
                msg.textContent = 'Resetting password...';

                try {
                    const res = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifier: savedIdentifier, code, newPassword })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        msg.style.color = '#34d399';
                        msg.textContent = data.message;
                        setTimeout(() => {
                            if (modal) modal.style.display = 'none';
                        }, 2000);
                    } else {
                        msg.style.color = '#f87171';
                        msg.textContent = data.error || 'Failed to reset.';
                    }
                } catch (err) {
                    msg.style.color = '#f87171';
                    msg.textContent = 'Network error. Try again.';
                }
            };
        }

        function logoutHelper() {
            localStorage.removeItem('samadhan_helper_profile');
            location.reload();
        }

        function toggleGlobalTheme() {
            const html = document.documentElement;
            const isLight = html.classList.toggle('light-mode');
            // Alternatively working with Tailwind dark class:
            const isDark = html.classList.toggle('dark');
            
            if (!isDark) {
                localStorage.setItem('samadhan_theme', 'light');
                document.getElementById('themeIcon').innerText = '☀️';
                document.getElementById('themeText').innerText = 'Light';
            } else {
                localStorage.setItem('samadhan_theme', 'dark');
                document.getElementById('themeIcon').innerText = '🌙';
                document.getElementById('themeText').innerText = 'Dark';
            }
        }
    </script>
</body>
</html>
