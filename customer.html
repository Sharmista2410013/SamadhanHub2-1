<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Samadhan Hub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
</head>
<body class="bg-slate-950 font-sans text-slate-100 antialiased min-h-screen flex flex-col justify-center items-center p-6">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center">
            <span class="text-xs font-bold uppercase tracking-widest text-emerald-400">Samadhan Hub</span>
            <h1 class="text-2xl font-black text-white mt-2">Customer Login</h1>
            <p class="text-slate-400 text-xs mt-1">Enter your registered email or phone number</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Email or Phone Number</label>
                <input type="text" id="loginEmailOrPhone" required placeholder="Enter email or phone..." class="w-full bg-slate-950 text-slate-200 text-sm px-4 py-3 rounded-xl border border-slate-800 focus:border-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-300 mb-2">Password</label>
                <input type="password" id="loginPassword" required placeholder="Enter password..." class="w-full bg-slate-950 text-slate-200 text-sm px-4 py-3 rounded-xl border border-slate-800 focus:border-emerald-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition text-sm">
                Login to Dashboard 🔑
            </button>
        </form>

        <div class="text-center text-xs text-slate-500">
            <a href="index.html" class="hover:underline">← Back to Home Overview</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginEmailOrPhone').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/customers/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identifier, password: password })
                });

                const data = await response.json();
                if (response.ok) {
                    // Save session data and redirect to your dashboard file
                    localStorage.setItem('customer_session', JSON.stringify(data.customer));
                    window.location.href = 'customer_dashboard.html';
                } else {
                    alert(data.error || 'Login failed.');
                }
            } catch (err) {
                console.error('Login error:', err);
                alert('Could not connect to backend server.');
            }
        });
    </script>
</body>
</html>
